
<!DOCTYPE html>
<html>
<head>
    <title>Les listes HTML</title>
</head>
<body>
    <h1>Les listes HTML</h1>

    <ol type="I">
        <li>Introduction</li>
        <li>Développement
            <ul>
                <li>Structure HTML</li>
                <li>Balises sémantiques</li>
                <li>Formulaires</li>
            </ul>
        </li>
        <li>Conclusion</li>
    </ol>

    <ol start="5">
        <li>Révisions</li>
        <li>Quiz</li>
        <li>Projet</li>
    </ol>

    <ol reversed>
        <li>Troisième</li>
        <li>Deuxième</li>
        <li>Première</li>
    </ol>

    <ul style="list-style-type: square;">
        <li>Élément 1</li>
        <li>Élément 2</li>
    </ul>
</body>
</html>
